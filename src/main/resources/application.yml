spring:
  application:
    name: ai-know-engine
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/know_engine_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: know_engine
    password: know_engine
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: true
  elasticsearch:
    uris: http://localhost:9200
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: neo4j666

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8010

logging:
  level:
    cn.weidong.llm.aiknowengine: info

minio:
  url: http://localhost:9000
  accessKey: admin
  secretKey: admin123456
  bucketName: know-engine
  endpoint: http://localhost:9000

mineru:
  baseUrl: https://mineru.net
  token: ${MINERU_API_TOKEN:}
  modelVersion: vlm
  ocrEnabled: true
  pollIntervalSeconds: 5
  maxPollTimes: 120
  workDir: data/mineru

elasticsearch:
  host: http://127.0.0.1:9200
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model-name: text-embedding-v4
  api-key: ${DASHSCOPE_API_KEY:}
  dimensions: 1536

langchain4j:
  open-ai:
    chat-model:
      api-key: ${DASHSCOPE_API_KEY:}
      model-name: qwen-max
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      log-requests: true
      log-responses: true
    title-chat-model:
      model-name: qwen3.5-flash
      temperature: 0.7
      enable-thinking: false
    vision-chat-model:
      api-key: ${DASHSCOPE_API_KEY:}
      model-name: qwen3-vl-plus
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      temperature: 0.7
      enable-thinking: false
    streaming-chat-model:
      api-key: ${DASHSCOPE_API_KEY:}
      model-name: qwen-max
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      log-requests: true
      log-responses: true
  community:
    neo4j:
      await-index-timeout: 300
      auth:
        uri: bolt://localhost:7687
        user: neo4j
        password: neo4j666
