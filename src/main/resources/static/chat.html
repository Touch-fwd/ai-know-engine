<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI 聊天</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f6f8;
            --panel: #ffffff;
            --panel-soft: #eef4f7;
            --text: #17202a;
            --muted: #657384;
            --line: #d8e0e7;
            --accent: #216f8f;
            --accent-strong: #19566f;
            --danger: #b64235;
            --user: #216f8f;
            --assistant: #ffffff;
            --shadow: 0 18px 42px rgba(22, 32, 42, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .app {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            min-height: 100vh;
        }

        aside {
            border-right: 1px solid var(--line);
            background: #fbfcfd;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        h1 {
            margin: 0;
            font-size: 20px;
            line-height: 1.2;
        }

        .icon-button,
        .send-button {
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        .icon-button {
            width: 38px;
            height: 38px;
            background: var(--accent);
            color: white;
            font-size: 22px;
            line-height: 1;
        }

        .field {
            display: grid;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: white;
            color: var(--text);
            font: inherit;
        }

        input {
            height: 40px;
            padding: 0 12px;
        }

        textarea {
            min-height: 52px;
            max-height: 180px;
            resize: vertical;
            padding: 12px;
            line-height: 1.55;
        }

        input:focus,
        textarea:focus {
            outline: 2px solid rgba(33, 111, 143, 0.18);
            border-color: var(--accent);
        }

        .conversation-list {
            display: grid;
            gap: 8px;
            overflow: auto;
            padding-right: 2px;
        }

        .conversation {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: white;
            padding: 10px 12px;
            text-align: left;
            cursor: pointer;
            display: grid;
            gap: 4px;
        }

        .conversation.is-active {
            border-color: var(--accent);
            background: var(--panel-soft);
        }

        .conversation-title {
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .conversation-time {
            color: var(--muted);
            font-size: 12px;
        }

        main {
            min-width: 0;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            padding: 22px;
            gap: 16px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .title {
            min-width: 0;
        }

        .title h2 {
            margin: 0;
            font-size: 22px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .title p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .danger {
            height: 38px;
            border: 1px solid #e2b8b3;
            border-radius: 8px;
            background: white;
            color: var(--danger);
            padding: 0 14px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .messages {
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 18px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .empty {
            margin: auto;
            color: var(--muted);
            text-align: center;
        }

        .message {
            max-width: min(760px, 86%);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px 14px;
            line-height: 1.65;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user);
            color: white;
            border-color: var(--user);
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--assistant);
        }

        .composer {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 96px;
            gap: 12px;
            align-items: end;
        }

        .send-button {
            height: 52px;
            background: var(--accent);
            color: white;
        }

        .send-button:hover,
        .icon-button:hover {
            background: var(--accent-strong);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.58;
        }

        @media (max-width: 820px) {
            .app {
                grid-template-columns: 1fr;
            }

            aside {
                border-right: 0;
                border-bottom: 1px solid var(--line);
                max-height: 280px;
            }

            main {
                min-height: calc(100vh - 280px);
                padding: 14px;
            }

            .message {
                max-width: 94%;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <aside>
        <div class="brand">
            <h1>AI 聊天</h1>
            <button class="icon-button" id="newChat" title="新建会话">+</button>
        </div>
        <label class="field">
            用户 ID
            <input id="userId" type="text" autocomplete="off">
        </label>
        <div class="conversation-list" id="conversationList"></div>
    </aside>

    <main>
        <div class="topbar">
            <div class="title">
                <h2 id="chatTitle">新会话</h2>
                <p id="chatMeta">输入消息开始对话</p>
            </div>
            <button class="danger" id="deleteChat" disabled>删除</button>
        </div>

        <section class="messages" id="messages">
            <div class="empty">还没有消息</div>
        </section>

        <form class="composer" id="composer">
            <textarea id="content" placeholder="输入聊天内容" required></textarea>
            <button class="send-button" id="send" type="submit">发送</button>
        </form>
    </main>
</div>

<script>
    const api = '/api/chat';
    const state = {
        conversationId: '',
        streaming: false
    };

    const userIdInput = document.querySelector('#userId');
    const conversationList = document.querySelector('#conversationList');
    const messages = document.querySelector('#messages');
    const chatTitle = document.querySelector('#chatTitle');
    const chatMeta = document.querySelector('#chatMeta');
    const contentInput = document.querySelector('#content');
    const sendButton = document.querySelector('#send');
    const deleteButton = document.querySelector('#deleteChat');

    userIdInput.value = localStorage.getItem('chatUserId') || 'demo-user';

    document.querySelector('#newChat').addEventListener('click', () => {
        state.conversationId = '';
        renderMessages([]);
        chatTitle.textContent = '新会话';
        chatMeta.textContent = '输入消息开始对话';
        deleteButton.disabled = true;
        markActiveConversation();
    });

    userIdInput.addEventListener('change', () => {
        localStorage.setItem('chatUserId', userIdInput.value.trim());
        state.conversationId = '';
        renderMessages([]);
        loadConversations();
    });

    deleteButton.addEventListener('click', async () => {
        if (!state.conversationId || state.streaming) return;
        await fetch(`${api}/conversations/${encodeURIComponent(state.conversationId)}`, {method: 'DELETE'});
        state.conversationId = '';
        renderMessages([]);
        chatTitle.textContent = '新会话';
        chatMeta.textContent = '输入消息开始对话';
        deleteButton.disabled = true;
        await loadConversations();
    });

    document.querySelector('#composer').addEventListener('submit', async (event) => {
        event.preventDefault();
        const userId = userIdInput.value.trim();
        const content = contentInput.value.trim();
        if (!userId || !content || state.streaming) return;

        localStorage.setItem('chatUserId', userId);
        contentInput.value = '';
        setStreaming(true);
        removeEmpty();
        appendMessage('user', content);
        const assistantNode = appendMessage('assistant', '');
        let showingProgress = false;

        try {
            const response = await fetch(`${api}/stream`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    userId,
                    content,
                    conversationId: state.conversationId || null
                })
            });
            if (!response.ok || !response.body) {
                throw new Error(await response.text());
            }
            await readSse(response.body, {
                conversation: (data) => {
                    const meta = JSON.parse(data);
                    state.conversationId = meta.conversationId;
                    deleteButton.disabled = false;
                    chatMeta.textContent = meta.conversationId;
                },
                progress: (data) => {
                    assistantNode.textContent = data;
                    showingProgress = true;
                    messages.scrollTop = messages.scrollHeight;
                },
                delta: (data) => {
                    if (showingProgress) {
                        assistantNode.textContent = '';
                        showingProgress = false;
                    }
                    assistantNode.textContent += data;
                    messages.scrollTop = messages.scrollHeight;
                },
                done: async () => {
                    await loadConversations();
                    markActiveConversation();
                }
            });
        } catch (error) {
            assistantNode.textContent = `请求失败：${error.message || error}`;
        } finally {
            setStreaming(false);
        }
    });

    async function loadConversations() {
        const userId = userIdInput.value.trim();
        if (!userId) return;
        const response = await fetch(`${api}/conversations?userId=${encodeURIComponent(userId)}`);
        const records = response.ok ? await response.json() : [];
        conversationList.innerHTML = '';
        for (const item of records) {
            const button = document.createElement('button');
            button.className = 'conversation';
            button.dataset.id = item.conversationId;
            button.innerHTML = `
                <span class="conversation-title"></span>
                <span class="conversation-time"></span>
            `;
            button.querySelector('.conversation-title').textContent = item.title || '新会话';
            button.querySelector('.conversation-time').textContent = item.updatedAt || '';
            button.addEventListener('click', () => openConversation(item));
            conversationList.appendChild(button);
        }
        markActiveConversation();
    }

    async function openConversation(conversation) {
        state.conversationId = conversation.conversationId;
        chatTitle.textContent = conversation.title || '新会话';
        chatMeta.textContent = conversation.conversationId;
        deleteButton.disabled = false;
        markActiveConversation();
        const response = await fetch(`${api}/conversations/${encodeURIComponent(conversation.conversationId)}/messages`);
        renderMessages(response.ok ? await response.json() : []);
    }

    function renderMessages(records) {
        messages.innerHTML = '';
        if (!records.length) {
            messages.innerHTML = '<div class="empty">还没有消息</div>';
            return;
        }
        for (const item of records) {
            appendMessage(item.type === 'USER' ? 'user' : 'assistant', item.content || '');
        }
    }

    function appendMessage(type, text) {
        removeEmpty();
        const node = document.createElement('div');
        node.className = `message ${type}`;
        node.textContent = text;
        messages.appendChild(node);
        messages.scrollTop = messages.scrollHeight;
        return node;
    }

    function removeEmpty() {
        const empty = messages.querySelector('.empty');
        if (empty) empty.remove();
    }

    async function readSse(body, handlers) {
        const reader = body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
            const {value, done} = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, {stream: true});
            const events = buffer.split('\n\n');
            buffer = events.pop() || '';
            for (const rawEvent of events) {
                dispatchSse(rawEvent, handlers);
            }
        }
        if (buffer) dispatchSse(buffer, handlers);
    }

    function dispatchSse(rawEvent, handlers) {
        const lines = rawEvent.split('\n');
        let event = 'message';
        const data = [];
        for (const line of lines) {
            if (line.startsWith('event:')) event = line.slice(6).trim();
            if (line.startsWith('data:')) data.push(line.slice(5).replace(/^ /, ''));
        }
        if (handlers[event]) handlers[event](data.join('\n'));
    }

    function markActiveConversation() {
        document.querySelectorAll('.conversation').forEach((node) => {
            node.classList.toggle('is-active', node.dataset.id === state.conversationId);
        });
    }

    function setStreaming(streaming) {
        state.streaming = streaming;
        sendButton.disabled = streaming;
        contentInput.disabled = streaming;
        deleteButton.disabled = streaming || !state.conversationId;
    }

    loadConversations();
</script>
</body>
</html>
